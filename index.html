<!DOCTYPE html>
<html lang="it" style="color-scheme: dark !important;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="keywords" content="sportpredix, tipster, campionato, sisal, snai, scommesse">
  <meta name="description" content="Tool Grafica - Generatore Grafica Tipster">
  <title>Grafiche Tipster</title>
  <link rel="canonical" href="https://sportpredix.github.io/GraficheTG/">
  <link rel="manifest" href="cache.webmanifest">
  <link rel="icon" href="icons/512x512.png" />
  <link rel="stylesheet" href="style.css">
  <link rel="apple-touch-icon" href="https://sportpredix.github.io/GraficheTG/icons/512x512.png"/>
  <link rel="apple-touch-startup-image" href="https://sportpredix.github.io/GraficheTG/icons/512x512.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
  <meta property="og:locale" content="it_IT">
  <meta property="og:title" content="Grafiche Tipster" />
  <meta property="og:type" content="website" />
  <meta property="og:description" content="Tool Grafica - Generatore Grafica Tipster. Creato da: enribocco"/>
  <meta property="og:url" content="https://sportpredix.github.io/GraficheTG">
  <meta property="og:site_name" content="sportpredix.github.io/GraficheTG">
  <meta property="og:image" content="https://sportpredix.github.io/GraficheTG/icons/512x512.png"/>
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="application-name" content="Grafiche Tipster" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Grafiche Tipster" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
</head>
<body>
  <main class="layout">
    <section class="controls card">
      <div class="title-wrap">
        <p class="eyebrow">Tool Grafica</p>
        <h1>Generatore Grafica Tipster</h1>
        <p class="subtitle">Compila i campi, visualizza la preview e scarica il PNG.</p>
      </div>

      <div class="grid two-col">
        <label>
          Sport
          <select id="sportSelect"></select>
        </label>
        <label>
          Campionato / Torneo
          <select id="competitionSelect"></select>
        </label>
      </div>

      <div class="grid">
        <label>
          Giornata / Sottotitolo
          <input id="matchday" type="text" value="Pronostici esclusivi t.me/sportpredix - Giornata 1">
        </label>
      </div>

      <div class="grid" id="customTitleWrap" hidden>
        <label>
          Titolo (solo Personale)
          <input id="customLeagueTitle" type="text" value="PERSONALE" placeholder="Inserisci il titolo della grafica">
        </label>
      </div>

      <div class="grid two-col">
        <label>
          Turno
          <select id="roundSelect"></select>
        </label>
        <label>
          Calendario
          <input id="calendarTag" type="text" value="Serie A 2025/26" readonly>
        </label>
      </div>

      <div class="grid two-col">
        <label>
          Colore Primario
          <input id="primaryColor" type="color" value="#031211">
        </label>
        <label>
          Colore Secondario
          <input id="secondaryColor" type="color" value="#11b9a8">
        </label>
      </div>

      <div class="grid two-col" id="threeByThreeColors" hidden>
        <label>
          Colore Accento (3 x 3)
          <input id="accentColor" type="color" value="#f06a1b">
        </label>
        <label>
          Colore Box (3 x 3)
          <input id="cardColor" type="color" value="#0e1116">
        </label>
      </div>

      <div class="actions-inline">
        <button id="addRow" type="button">Aggiungi Partita</button>
      </div>

      <div id="rowsEditor" class="rows-editor"></div>

      <div class="actions-inline">
        <button id="downloadPng" type="button" class="accent">Scarica PNG</button>
      </div>
    </section>

    <section class="preview card">
      <p class="preview-label">Anteprima</p>
      <div id="previewWrap" class="preview-wrap">
        <div id="graphicScaleBox" class="graphic-scale-box">
          <div id="graphic" class="graphic">
            <header class="graphic-header">
              <div class="graphic-heading">
                <h2 id="previewLeague">SERIE A</h2>
                <p id="previewMatchday">Pronostici esclusivi t.me/sportpredix - Giornata 1</p>
              </div>
              <div id="previewCompetitionLogoWrap" class="competition-logo-wrap">
                <img id="previewCompetitionLogo" alt="">
              </div>
            </header>
            <div id="matchesList" class="matches-list"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="personal-league.js"></script>
  <script src="three-by-three.js"></script>
  <script src="serie-a-2025-26.js"></script>
  <script src="premier-league-2025-26.js"></script>
  <script src="la-liga-2025-26.js"></script>
  <script src="bundesliga-2025-26.js"></script>
  <script src="ligue-1-2025-26.js"></script>
  <script src="champions-league-2025-26.js"></script>
  <script src="europa-league-2024-25.js"></script>
  <script src="conference-league-2024-25.js"></script>
  <script src="coppa-italia-2024-25.js"></script>
  <script src="fa-cup-2024-25.js"></script>
  <script src="copa-del-rey-2024-25.js"></script>
  <script src="dfb-pokal-2024-25.js"></script>
  <script src="coupe-de-france-2024-25.js"></script>
  <script src="indian-wells-2026.js"></script>
  <script src="app.js"></script>
</body>
</html>
